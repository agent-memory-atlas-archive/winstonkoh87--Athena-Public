name: CI — Athena Quality Gate

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint + Type Check + Security + Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install mypy pip-audit

      # --exit-zero was removed on 2026-07-25. With it, ruff reported findings
      # as annotations and then exited 0 whatever it found — 48 errors had
      # accumulated behind a green check, including a duplicate MCP tool
      # definition that silently dropped a permission gate. A lint step that
      # cannot fail is not a lint step.
      - name: Lint (ruff)
        run: ruff check src/ scripts/ tests/ --output-format=github

      # examples/ is published code — the part readers copy. It is not held to
      # full lint (1,593 findings, nearly all whitespace), but it must at least
      # RUN. This selects only the classes that mean "this file cannot execute":
      # undefined names and syntax errors. Three broken examples shipped before
      # this step existed, one of them for five months.
      - name: Published examples must be executable
        run: ruff check examples/ --select F821,F822,F823,E9 --output-format=github

      - name: Type check (mypy)
        run: mypy src/ --ignore-missing-imports --no-error-summary || true

      - name: Security audit (pip-audit)
        run: pip-audit --desc on --fix --dry-run || true

      - name: Detect silent exceptions
        run: |
          echo "Checking for bare except clauses..."
          if grep -rn "except:$" src/ scripts/ --include="*.py"; then
            echo "::warning::Found bare except clauses — these silently swallow errors"
          fi

      - name: Run tests
        run: pytest tests/ -v --tb=short 2>/dev/null || echo "No tests found or test dependencies missing"
